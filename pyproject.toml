[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitmate-cli"
version = "0.1.0"
description = "AI-assisted git commit messages, PR summaries, and changelogs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Amar K P", email = "amarkerpala59@gmail.com" }]
keywords = [
    "git",
    "commit",
    "commit-message",
    "changelog",
    "pull-request",
    "llm",
    "ai",
    "gemini",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "keyring>=25.0",
    "tomli-w>=1.0",
    "diskcache>=5.6",
    "tenacity>=8.2",
    "httpx>=0.27",
    "google-genai>=0.3",   # default provider (Gemini 3 Flash / Flash-Lite)
    "anthropic>=0.34",     # secondary provider, same LLMProvider interface
    "pyperclip>=1.8.2",
]

[project.urls]
Homepage = "https://github.com/getdownandcode/gitmate"
Repository = "https://github.com/getdownandcode/gitmate"
Issues = "https://github.com/getdownandcode/gitmate/issues"
Changelog = "https://github.com/getdownandcode/gitmate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gitmate = "gitmate.cli:app"
gitmate-hook = "gitmate.hooks:main"

# Internal build documentation; not needed by anyone who pip-installs.
[tool.hatch.build.targets.sdist]
exclude = ["plan.md", "AGENTS.md"]

# Import package differs from the distribution name (gitmate vs gitmate-cli).
[tool.hatch.build.targets.wheel]
packages = ["src/gitmate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
