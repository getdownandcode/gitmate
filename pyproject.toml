[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitmate"
version = "0.1.0"
description = "AI-assisted git commit messages, PR summaries, and changelogs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "keyring>=25.0",
    "tomli-w>=1.0",
    "diskcache>=5.6",
    "tenacity>=8.2",
    "google-genai>=0.3",   # default provider (Gemini 3 Flash / Flash-Lite)
    "anthropic>=0.34",     # secondary provider, same LLMProvider interface
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gitmate = "gitmate.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
